<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHMED16A Tools</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" integrity="sha384-cmj3JhQ6PRbUDt5man3nVqHXcMSvk16BQ1IsZTxTRYPLrlQTshDfe/2KAnfDExPB" crossorigin="anonymous" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" integrity="sha384-doD8MKhm6fBISLV8motWM1zGEVpnbszK5vXO5jHKZ1+rzP1cKd8TgKCI8mlzvY7n" crossorigin="anonymous" defer></script>
  </head>
  <body>
    <div id="app" class="app">
      <header class="app-header">
        <h1 id="app-title"></h1>
        <p id="app-description" class="app-description"></p>
        <p id="app-tagline" class="notice notice-inline" role="note"></p>
      </header>

      <div class="app-tabs">
        <div id="tablist" class="tablist" role="tablist"></div>
        <main class="tabpanels">
          <section id="panel-json-to-chmed" class="tabpanel" role="tabpanel" tabindex="0"></section>
          <section
            id="panel-chmed-to-json"
            class="tabpanel"
            role="tabpanel"
            tabindex="0"
            hidden
          ></section>
          <section
            id="panel-pdf-to-chmed"
            class="tabpanel"
            role="tabpanel"
            tabindex="0"
            hidden
          ></section>
        </main>
      </div>

      <footer class="app-footer">
        <p id="app-disclaimer" class="notice" role="note"></p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
